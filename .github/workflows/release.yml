name: Build and publish installers

# Builds the standalone macOS + Windows installer/uninstaller and republishes them onto the
# "v1.0.0" GitHub Release, which is what the landing page's "releases/latest/download/..." links
# point at (see docs/index.html) — so a push to main is what keeps those download links current.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

jobs:
  build-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable
      - run: npm install

      # Public shared build downloaded by every user's nivris-update-helper (see
      # scripts/nivris-update-helper.mjs's "fast path") — can't embed any one user's real update
      # token, so it gets the placeholder text-substituted for the real one at apply-time (see
      # TOKEN_PLACEHOLDER in scripts/lib/apply-update.mjs). Port is not machine-specific.
      - name: Build module
        run: npm run build
        env:
          NIVRIS_UPDATE_TOKEN: __NIVRIS_TOKEN_PLACEHOLDER__
          NIVRIS_UPDATE_PORT: "47291"

      - run: mkdir -p dist-module
      - run: cp lib/index.js dist-module/nivris-module.js
      - run: cp lib/index.js.map dist-module/nivris-module.js.map
      - run: echo "{\"sha\":\"${{ github.sha }}\"}" > dist-module/nivris-version.json

      - uses: actions/upload-artifact@v4
        with:
          name: nivris-module
          path: |
            dist-module/nivris-module.js
            dist-module/nivris-module.js.map
            dist-module/nivris-version.json
          retention-days: 30

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # matrix-js-sdk (a git dependency here) runs its own `pnpm build` prepare script on
      # install — needs pnpm available even though this repo itself uses npm.
      - run: corepack enable
      - run: npm install

      - name: Build installer + uninstaller .app bundles
        run: bash scripts/build-standalone-mac.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: nivris-macos-installers
          path: |
            dist/NivrisInstaller-macOS.zip
            dist/NivrisUninstaller-macOS.zip
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Node 20, not 22, and not Bun: this exe is hosted by whatever node.exe builds it (a SEA blob
      # is version-locked to its runtime), and the v20 line is the one that still runs on the older
      # Windows 10 builds this binary exists to serve. Bun's own compiled output imports
      # ClosePseudoConsole (Windows 10 1809+), which is exactly what broke there — see
      # scripts/build-sea-win.mjs.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      # See scripts/build-standalone-mac.sh's matching step for why these env vars.
      - name: Build module
        run: npm run build
        env:
          NIVRIS_BUILD_SHA: ${{ github.sha }}
          NIVRIS_UPDATE_TOKEN: __NIVRIS_TOKEN_PLACEHOLDER__
          NIVRIS_UPDATE_PORT: "47291"

      # The progress window's PowerShell runs hidden, detached, from a GUI-subsystem exe — three
      # layers that each swallow output, so a syntax error in it shows up as "no window appeared"
      # and nothing else. Shipped exactly that way once. Parse it here, where a Windows PowerShell
      # is available to do it.
      - name: Check the progress window script parses
        run: node scripts/check-progress-ps.mjs

      - name: Compile installer.exe
        run: node scripts/build-sea-win.mjs scripts/standalone-installer.ts dist/NivrisInstaller-Windows.exe
        env:
          NIVRIS_BUILD_SHA: ${{ github.sha }}

      - name: Compile uninstaller.exe
        run: node scripts/build-sea-win.mjs scripts/standalone-uninstaller.ts dist/NivrisUninstaller-Windows.exe
        env:
          NIVRIS_BUILD_SHA: ${{ github.sha }}

      # Proves the shipped binary no longer imports the API that made the old one unloadable on
      # Windows 10 before build 17763 — a build-time assert, since CI has no such machine to test on.
      - name: Check the exe has no ConPTY imports
        shell: pwsh
        run: |
          foreach ($f in @("dist/NivrisInstaller-Windows.exe", "dist/NivrisUninstaller-Windows.exe")) {
            $bytes = [IO.File]::ReadAllBytes($f)
            $text = [Text.Encoding]::ASCII.GetString($bytes)
            if ($text.Contains("ClosePseudoConsole")) { throw "$f van import ConPTY" }
            # Subsystem 2 = GUI: no console window, and no QuickEdit freeze with it.
            $pe = [BitConverter]::ToUInt32($bytes, 0x3c)
            $sub = [BitConverter]::ToUInt16($bytes, $pe + 24 + 68)
            if ($sub -ne 2) { throw "$f subsystem = $sub, can phai la 2 (GUI)" }
            Write-Host "$f OK (no ConPTY, GUI subsystem)"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: nivris-windows-installers
          path: |
            dist/NivrisInstaller-Windows.exe
            dist/NivrisUninstaller-Windows.exe
          retention-days: 30

  publish:
    needs: [build-module, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nivris-*-installers
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: nivris-module
          path: dist

      # The trailing commit SHA is load-bearing, not decorative — see NivrisUpdateChecker.ts's
      # fetchLatestSha(), which reads it back out of this exact field via the (CORS-enabled)
      # releases/latest API. It needs this because commits/main updates the instant a commit is
      # pushed, well before this job finishes actually publishing new assets a few minutes later —
      # comparing against that raced the in-app "update available" banner ahead of there being
      # anything new to download yet, so clicking Update just reapplied the still-current build and
      # looked stuck in a loop until this job caught up. This release `name` only changes once this
      # step actually runs, at the very end of a real successful publish.
      # The release body carries the newest changelog entry, which is the only way notes for a new
      # version can reach someone still running the old build (their bundle's changelog stops at
      # the version they have). Fails the publish if package.json and the changelog disagree.
      - uses: actions/checkout@v4
        with:
          path: repo
      - name: Generate release notes
        run: node repo/scripts/release-notes.mjs > release-notes.md

      # The script-based installers (for machines that can't run the Bun .exe) were uploaded to the
      # release by hand once and then never again, so edits to them in this repo never reached
      # anyone. Republish them from source every time, like every other asset.
      - name: Stage script installers
        run: |
          cp repo/installers/Install-Nivris-Windows.bat dist/
          cp repo/installers/Uninstall-Nivris-Windows.bat dist/
          (cd repo/installers && zip -j ../../dist/Install-Nivris-Mac.zip Install-Nivris-Mac.command)
          (cd repo/installers && zip -j ../../dist/Uninstall-Nivris-Mac.zip Uninstall-Nivris-Mac.command)

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "N.I.V.R.I.S. installers (v1) — ${{ github.sha }}"
          body_path: release-notes.md
          make_latest: "true"
          files: |
            dist/NivrisInstaller-macOS.zip
            dist/NivrisUninstaller-macOS.zip
            dist/NivrisInstaller-Windows.exe
            dist/NivrisUninstaller-Windows.exe
            dist/nivris-module.js
            dist/nivris-module.js.map
            dist/nivris-version.json
            dist/Install-Nivris-Windows.bat
            dist/Uninstall-Nivris-Windows.bat
            dist/Install-Nivris-Mac.zip
            dist/Uninstall-Nivris-Mac.zip
